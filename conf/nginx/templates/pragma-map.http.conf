# Pragma for responses that don't set their own add_header (cep-headers.conf), derived from the
# Cache-Control value cache-map.http.conf picks. "no-cache" only alongside "no-store", as before; a
# response a deployment maps to a cacheable value gets no Pragma, which would contradict it for
# HTTP/1.0 caches (nginx sends no header for an empty value). Kept out of cache-map.http.conf, which
# deployments replace with their own copy, so deployments never need to repeat this map.
map $cep_cache_control $cep_pragma {
    "no-store" "no-cache";
    default    "";
}
