# Cache-Control for responses that don't set their own add_header (cep-headers.conf). Everything is
# "no-store" unless a deployment mounts its own copy of this file over
# /etc/nginx/conf.d/cache-map.http.conf, mapping the paths of public, user-independent responses
# (e.g. a sitemap) to a cacheable value. Never map a page that shows the signed-in user.
map $uri $cep_cache_control {
    default "no-store";
}
